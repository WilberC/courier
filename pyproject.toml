[project]
name = "courier-bot"
version = "0.1.0"
description = "Command-and-notification bot with FastAPI + Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11.0",
  "celery>=5.5.3",
  "fastapi>=0.116.1",
  "python-telegram-bot>=22.3",
  "redis>=6.4.0",
  "sentry-sdk>=2.34.1",
  "sqlalchemy>=2.0.43",
  "sqlmodel>=0.0.24",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.12.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
